<nav>
    <h2>NK Scents</h2>
    <ul class="menu">
        <li><a href="index.html">Home</a></li>

        <li class="dropdown">
            <a href="products.html">Categories ▾</a>

                <li><a href="products.html?category=women">Women</a></li>

<div class="form-box">
    <h2>Register</h2>
    <form onsubmit="handleRegister(event)">
        <input type="text" id="regName" name="name" placeholder="Username" required>
        <input type="email" id="regEmail" name="email" placeholder="Email" required>
        <input type="password" id="regPassword" name="password" placeholder="Password" required>
        <button type="submit" name="register" class="btn" style="width: 100%; border: none; cursor: pointer; font-family: inherit;">Register</button>
    </form>
    <p style="margin-top: 20px;">Already have an account? <a href="login.html">Login</a></p>
